---
# README FIRST
# 1. Subscribe to https://github.com/ansible-collections/news-for-maintainers
#    (click the Watch button on the homepage > Custom > Issues)
#    and keep this matrix up to date in accordance to related announcements.
#    Timely add new ansible-core versions and consider dropping support
#    and testing against its EOL versions.
# 2. The target Python versions per ansible-core branch are taken from
#    REMOTE_ONLY_PYTHON_VERSIONS + CONTROLLER_PYTHON_VERSIONS in
#    test/lib/ansible_test/_util/target/common/constants.py of that branch.
# 3. For the comprehensive list of the inputs supported by the
#    ansible-community/ansible-test-gh-action GitHub Action, see
#    https://github.com/marketplace/actions/ansible-test.
# 4. The "check" job is the single required status check for branch protection.
#    See https://github.com/marketplace/actions/alls-green#gotchas for detail.
# 5. If you need help please ask in #community:ansible.com on Matrix
#    or in bridged #ansible-community on the Libera.Chat IRC channel.
#    See https://docs.ansible.com/ansible/devel/community/communication.html
#    for details.

name: CI
on:
  # Run CI against all pushes (direct commits, also merged PRs), Pull Requests
  push:
    branches:
      - main
      - stable-*
  pull_request:
  # Run CI once per week (Mondays at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still
  # testing against latest version of ansible-test for each ansible-core
  # version
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

###
# Sanity tests (REQUIRED)
#
# https://docs.ansible.com/ansible/latest/dev_guide/testing_sanity.html

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      fail-fast: false
      matrix:
        ansible:
          # Sanity is tested against all stable-X.Y branches the collection
          # supports. Unreleased branches (`devel`, `milestone`) are
          # deliberately not tested: they fail as new sanity tests land, which
          # is churn rather than signal for this collection.
          # ansible-core 2.18 and older are EOL as of 2026-05.
          - stable-2.19
          - stable-2.20
          - stable-2.21

    runs-on: ubuntu-latest

    steps:
      # Run sanity tests inside a Docker container.
      # The docker container has all the pinned dependencies that are
      # required and all Python versions Ansible supports.
      - name: Perform sanity testing
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          # OPTIONAL If set to true, will test only against changed files,
          # which should improve CI performance. See limitations on
          # https://github.com/ansible-community/ansible-test-gh-action#pull-request-change-detection
          pull-request-change-detection: false

###
# Unit tests (OPTIONAL)
#
# https://docs.ansible.com/ansible/latest/dev_guide/testing_units.html
#
# NOTE: the collection currently ships no unit tests, so these jobs pass
# trivially. They are kept so that tests added under tests/units/ are picked
# up without touching CI.

  units:
    runs-on: ubuntu-latest

    name: Units (Ⓐ${{ matrix.ansible }})
    strategy:
      # As soon as the first unit test fails, cancel the others to free up the CI queue
      fail-fast: true
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21

    steps:
      - name: >-
          Perform unit testing against
          Ansible version ${{ matrix.ansible }}
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: units
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          # OPTIONAL If set to true, will test only against changed files,
          # which should improve CI performance. See limitations on
          # https://github.com/ansible-community/ansible-test-gh-action#pull-request-change-detection
          pull-request-change-detection: false

###
# Integration tests (RECOMMENDED)
#
# https://docs.ansible.com/ansible/latest/dev_guide/testing_integration.html

  integration:
    runs-on: ubuntu-latest

    name: I (Ⓐ${{ matrix.ansible }}+py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Every row is explicit: each ansible-core branch supports a different
        # set of target Python versions, so a cross-product would schedule jobs
        # that ansible-test refuses to run.
        include:
          # Only the oldest and newest target Python of each ansible-core
          # branch are tested, to keep the weekly run short. This tests the
          # ends of each supported range: 3.8, 3.9, 3.13 and 3.14. Python
          # 3.10 - 3.12 are supported but NOT exercised by CI, so a break that
          # only shows up there will not be caught here.
          # ansible-core 2.19 (EOL 2026-11): target Python 3.8 - 3.13
          - ansible: stable-2.19
            python: '3.8'
          - ansible: stable-2.19
            python: '3.13'
          # ansible-core 2.20 (EOL 2027-05): target Python 3.9 - 3.14
          - ansible: stable-2.20
            python: '3.9'
          - ansible: stable-2.20
            python: '3.14'
          # ansible-core 2.21 (EOL 2027-11): target Python 3.9 - 3.14
          - ansible: stable-2.21
            python: '3.9'
          - ansible: stable-2.21
            python: '3.14'
    steps:
      - name: >-
          Perform integration testing against
          Ansible version ${{ matrix.ansible }}
          under Python ${{ matrix.python }}
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          target-python-version: ${{ matrix.python }}
          testing-type: integration
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          # OPTIONAL If set to true, will test only against changed files,
          # which should improve CI performance. See limitations on
          # https://github.com/ansible-community/ansible-test-gh-action#pull-request-change-detection
          pull-request-change-detection: false

  check:  # This job does nothing and is only used for the branch protection
          # or multi-stage CI jobs, like making sure that all tests pass before
          # a publishing job is started.
    if: always()

    needs:
      - sanity
      - units
      - integration

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
